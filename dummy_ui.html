<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Test Login</title>
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 300px; }
        .form-group { margin-bottom: 1rem; }
        label { display: block; margin-bottom: 0.5rem; font-weight: bold; }
        input { width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 0.75rem; background: #007bff; color: white; border: none; border-radius: 4px; cursor: pointer; font-size: 1rem; }
        button:hover { background: #0056b3; }
        /* A very low contrast button that standard edge detection will miss! */
        .faint-btn { background: #f9f9fa; color: #e2e2e5; border: 1px solid #f0f0f3; margin-top: 15px; font-size: 0.8rem; padding: 0.5rem; }
    </style>
</head>
<body>
    <div class="login-box">
        <h2>System Login</h2>
        <div class="form-group">
            <label for="email">Email</label>
            <input type="email" id="email" placeholder="agent@opencv.org">
        </div>
        <div class="form-group">
            <label for="password">Password</label>
            <input type="password" id="password" placeholder="********">
        </div>
        <button id="login-btn">Login to System</button>
        
        <!-- The Challenge for the Agent -->
        <button id="admin-btn" class="faint-btn">Hidden Admin Login</button>
    </div>
</body>
</html>
